<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Proposed evidence loop for a Rust deep-learning study</title>
  <desc id="desc">A clean four-stage research plan: define one question, choose a neural-network method, specify the data and test, then report correctness, repeatability, resources, and limitations. This is a proposed process only; Arxh has no implementation or measured ML results yet.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7b8da5" />
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="520" rx="22" fill="#f5f7fb" />
  <text class="mono" x="64" y="62" font-size="13" font-weight="700" letter-spacing="1.5" fill="#087e8b">ARXH / PROPOSED RESEARCH METHOD</text>
  <text class="sans" x="64" y="112" font-size="32" font-weight="700" fill="#142136">From method to evidence</text>
  <text class="sans" x="64" y="144" font-size="16" fill="#4e5d72">A small Rust ML study should make its question, constraints, and checks visible.</text>

  <path d="M332 274H366M632 274H666M932 274H966" fill="none" stroke="#7b8da5" stroke-width="2" marker-end="url(#arrow)" />

  <g>
    <rect x="64" y="190" width="268" height="178" rx="12" fill="#ffffff" stroke="#d9e1ec" />
    <rect x="64" y="190" width="4" height="178" rx="2" fill="#147d92" />
    <text class="mono" x="88" y="226" font-size="12" font-weight="700" fill="#147d92">01 / QUESTION</text>
    <text class="sans" x="88" y="263" font-size="21" font-weight="700" fill="#142136">Define the claim</text>
    <text class="sans" x="88" y="296" font-size="14" fill="#4e5d72">One task. One observable</text>
    <text class="sans" x="88" y="318" font-size="14" fill="#4e5d72">question. One way to check it.</text>
    <text class="mono" x="88" y="348" font-size="11" fill="#7b8798">WHAT WOULD CHANGE OUR MIND?</text>
  </g>

  <g>
    <rect x="366" y="190" width="266" height="178" rx="12" fill="#ffffff" stroke="#d9e1ec" />
    <rect x="366" y="190" width="4" height="178" rx="2" fill="#3465a4" />
    <text class="mono" x="390" y="226" font-size="12" font-weight="700" fill="#3465a4">02 / METHOD</text>
    <text class="sans" x="390" y="263" font-size="21" font-weight="700" fill="#142136">Choose a method</text>
    <text class="sans" x="390" y="296" font-size="14" fill="#4e5d72">MLP · CNN · attention</text>
    <text class="sans" x="390" y="318" font-size="14" fill="#4e5d72">are candidates to study.</text>
    <text class="mono" x="390" y="348" font-size="11" fill="#7b8798">NOT A RESULT OR A WINNER</text>
  </g>

  <g>
    <rect x="666" y="190" width="266" height="178" rx="12" fill="#ffffff" stroke="#d9e1ec" />
    <rect x="666" y="190" width="4" height="178" rx="2" fill="#b46a1d" />
    <text class="mono" x="690" y="226" font-size="12" font-weight="700" fill="#9a5b18">03 / PROTOCOL</text>
    <text class="sans" x="690" y="263" font-size="21" font-weight="700" fill="#142136">Fix the test</text>
    <text class="sans" x="690" y="296" font-size="14" fill="#4e5d72">Data · split · seed · baseline</text>
    <text class="sans" x="690" y="318" font-size="14" fill="#4e5d72">and resource limit come first.</text>
    <text class="mono" x="690" y="348" font-size="11" fill="#7b8798">CHECK CORRECTNESS BEFORE SPEED</text>
  </g>

  <g>
    <rect x="966" y="190" width="250" height="178" rx="12" fill="#ffffff" stroke="#d9e1ec" />
    <rect x="966" y="190" width="4" height="178" rx="2" fill="#26744f" />
    <text class="mono" x="990" y="226" font-size="12" font-weight="700" fill="#26744f">04 / EVIDENCE</text>
    <text class="sans" x="990" y="263" font-size="21" font-weight="700" fill="#142136">Report the limits</text>
    <text class="sans" x="990" y="296" font-size="14" fill="#4e5d72">Correctness · repeats · runtime</text>
    <text class="sans" x="990" y="318" font-size="14" fill="#4e5d72">resources · failures · unknowns</text>
    <text class="mono" x="990" y="348" font-size="11" fill="#7b8798">NO CLAIM WITHOUT A RUN</text>
  </g>

  <path d="M1090 386V414H190V386" fill="none" stroke="#9aa8b9" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrow)" />
  <text class="sans" x="640" y="407" text-anchor="middle" font-size="12" fill="#617084">Use evidence and open questions to refine the next question</text>

  <rect x="64" y="438" width="1152" height="48" rx="10" fill="#eaf2f5" />
  <circle cx="87" cy="462" r="5" fill="#0c8792" />
  <text class="sans" x="103" y="467" font-size="13" font-weight="700" fill="#234052">PROPOSED ONLY</text>
  <text class="sans" x="236" y="467" font-size="13" fill="#46586a">No Rust ML implementation, trained model, or benchmark result is published in this repository.</text>
</svg>
