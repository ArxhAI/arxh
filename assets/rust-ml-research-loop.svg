<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Arxh's machine learning in Rust research loop</title>
  <desc id="desc">A four-step learning roadmap: understand machine learning foundations, explore Rust libraries, test correctness and repeatability, and share results and open questions. This is a proposed direction, not a completed implementation.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="1" stop-color="#eef5ff" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1258e8" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#12345a" flood-opacity="0.08" />
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#canvas)" />
  <circle cx="1160" cy="65" r="135" fill="#d7e8ff" opacity="0.42" />
  <circle cx="1065" cy="72" r="64" fill="#c9f3f8" opacity="0.55" />

  <rect x="72" y="42" width="215" height="32" rx="16" fill="#e3efff" />
  <circle cx="91" cy="58" r="5" fill="#1769ff" />
  <text class="sans" x="106" y="63" font-size="12" font-weight="700" letter-spacing="1.4" fill="#174ea6">ARXH · LEARNING IN PUBLIC</text>

  <text class="sans" x="72" y="125" font-size="34" font-weight="700" fill="#101d35">Machine learning, explored with Rust</text>
  <text class="sans" x="72" y="160" font-size="17" fill="#53647c">A careful path from fundamentals to small, reproducible experiments.</text>

  <!-- connectors -->
  <path d="M326 304h27m-8-8 8 8-8 8" fill="none" stroke="#83a1c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M620 304h27m-8-8 8 8-8 8" fill="none" stroke="#83a1c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M914 304h27m-8-8 8 8-8 8" fill="none" stroke="#83a1c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- step 1 -->
  <g filter="url(#shadow)">
    <rect x="72" y="202" width="254" height="204" rx="18" fill="#ffffff" />
  </g>
  <rect x="92" y="222" width="42" height="27" rx="13.5" fill="#eaf1ff" />
  <text class="mono" x="113" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#1557c0">01</text>
  <g fill="none" stroke="#1769ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="277" cy="236" r="6" /><circle cx="299" cy="225" r="6" /><circle cx="301" cy="248" r="6" />
    <path d="m282 233 11-6m-10 11 12 8" />
  </g>
  <text class="sans" x="92" y="288" font-size="19" font-weight="700" fill="#101d35">Understand</text>
  <text class="sans" x="92" y="319" font-size="14" fill="#53647c">Build the foundations:</text>
  <text class="sans" x="92" y="343" font-size="14" fill="#53647c">data, tensors, objectives</text>
  <text class="sans" x="92" y="365" font-size="14" fill="#53647c">and simple baselines.</text>

  <!-- step 2 -->
  <g filter="url(#shadow)">
    <rect x="366" y="202" width="254" height="204" rx="18" fill="#ffffff" />
  </g>
  <rect x="386" y="222" width="42" height="27" rx="13.5" fill="#e9f8fb" />
  <text class="mono" x="407" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#087d91">02</text>
  <text class="mono" x="566" y="243" text-anchor="middle" font-size="23" font-weight="700" fill="#08a1ba">{ }</text>
  <text class="sans" x="386" y="288" font-size="19" font-weight="700" fill="#101d35">Explore Rust tools</text>
  <text class="sans" x="386" y="319" font-size="14" fill="#53647c">Study options such as</text>
  <text class="sans" x="386" y="343" font-size="14" fill="#53647c">Linfa, Candle and Burn—</text>
  <text class="sans" x="386" y="365" font-size="14" fill="#53647c">without picking a winner early.</text>

  <!-- step 3 -->
  <g filter="url(#shadow)">
    <rect x="660" y="202" width="254" height="204" rx="18" fill="#ffffff" />
  </g>
  <rect x="680" y="222" width="42" height="27" rx="13.5" fill="#fff2e9" />
  <text class="mono" x="701" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#bf4c1b">03</text>
  <g fill="none" stroke="#ef6a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M856 245v-13m12 13v-24m12 24v-18" />
    <path d="M851 248h34" />
  </g>
  <text class="sans" x="680" y="288" font-size="19" font-weight="700" fill="#101d35">Test the evidence</text>
  <text class="sans" x="680" y="319" font-size="14" fill="#53647c">Check correctness first;</text>
  <text class="sans" x="680" y="343" font-size="14" fill="#53647c">then measure repeatability,</text>
  <text class="sans" x="680" y="365" font-size="14" fill="#53647c">runtime and hardware.</text>

  <!-- step 4 -->
  <g filter="url(#shadow)">
    <rect x="954" y="202" width="254" height="204" rx="18" fill="#ffffff" />
  </g>
  <rect x="974" y="222" width="42" height="27" rx="13.5" fill="#eaf1ff" />
  <text class="mono" x="995" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#1557c0">04</text>
  <g fill="none" stroke="#1769ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1144 233a12 12 0 0 1 20-8l3 3m0-8v8h-8" />
    <path d="M1166 239a12 12 0 0 1-20 8l-3-3m0 8v-8h8" />
  </g>
  <text class="sans" x="974" y="288" font-size="19" font-weight="700" fill="#101d35">Share what we learn</text>
  <text class="sans" x="974" y="319" font-size="14" fill="#53647c">Publish the setup, results,</text>
  <text class="sans" x="974" y="343" font-size="14" fill="#53647c">limitations and the next</text>
  <text class="sans" x="974" y="365" font-size="14" fill="#53647c">question—not just a score.</text>

  <rect x="72" y="444" width="1136" height="62" rx="15" fill="#fff7ed" stroke="#f5d3b7" />
  <circle cx="100" cy="475" r="8" fill="#ed6a32" />
  <path d="M100 470v6m0 4v.5" stroke="#fff" stroke-width="2" stroke-linecap="round" />
  <text class="sans" x="122" y="472" font-size="14" font-weight="700" fill="#8f3e1d">Research direction only</text>
  <text class="sans" x="122" y="491" font-size="13" fill="#805c49">No Rust implementation or ML benchmark results are published yet.</text>
</svg>
