<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">A proposed Rust-first workflow for an ML experiment</title>
  <desc id="desc">Four proposed stages for future Rust ML work: author a crate, check types and borrowing, test known inputs, then record versions and the exact command. The diagram is a plan only; no Rust ML implementation exists in the repository.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7188a6" />
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1920" height="1080" rx="32" fill="#f5f7fb" />
  <text class="mono" x="96" y="94" font-size="23" font-weight="700" letter-spacing="3" fill="#b94c31">ARXH / RUST DEVELOPMENT METHOD</text>
  <text class="sans" x="96" y="168" font-size="58" font-weight="700" fill="#142136">A Rust-first experiment path</text>
  <text class="sans" x="96" y="218" font-size="25" fill="#506078">Use the language toolchain to make assumptions, errors, and checks visible.</text>

  <path d="M520 548H574M960 548H1014M1400 548H1454" fill="none" stroke="#7188a6" stroke-width="4" marker-end="url(#arrow)" />

  <g>
    <rect x="96" y="314" width="424" height="458" rx="20" fill="#ffffff" stroke="#d8e0eb" stroke-width="2" />
    <rect x="96" y="314" width="8" height="458" rx="4" fill="#d75d3e" />
    <text class="mono" x="136" y="376" font-size="20" font-weight="700" fill="#b94c31">01 / AUTHOR</text>
    <text class="sans" x="136" y="434" font-size="36" font-weight="700" fill="#142136">Start with a crate</text>
    <rect x="136" y="478" width="344" height="142" rx="12" fill="#101a2a" />
    <text class="mono" x="164" y="530" font-size="24" fill="#f4f7fb">Cargo.toml</text>
    <text class="mono" x="164" y="574" font-size="24" fill="#9de2d2">src/main.rs</text>
    <text class="sans" x="136" y="674" font-size="22" fill="#56657a">Declare dependencies and edition.</text>
    <text class="sans" x="136" y="710" font-size="22" fill="#56657a">Keep the research question small.</text>
  </g>

  <g>
    <rect x="576" y="314" width="384" height="458" rx="20" fill="#ffffff" stroke="#d8e0eb" stroke-width="2" />
    <rect x="576" y="314" width="8" height="458" rx="4" fill="#436fae" />
    <text class="mono" x="616" y="376" font-size="20" font-weight="700" fill="#315d98">02 / CHECK</text>
    <text class="sans" x="616" y="434" font-size="36" font-weight="700" fill="#142136">Ask rustc</text>
    <rect x="616" y="478" width="304" height="94" rx="12" fill="#101a2a" />
    <text class="mono" x="646" y="536" font-size="28" fill="#c6d9fb">cargo check</text>
    <text class="sans" x="616" y="634" font-size="22" fill="#56657a">Types · borrowing · errors</text>
    <text class="sans" x="616" y="674" font-size="22" fill="#56657a">A successful check is not</text>
    <text class="sans" x="616" y="710" font-size="22" fill="#56657a">evidence of model correctness.</text>
  </g>

  <g>
    <rect x="1016" y="314" width="384" height="458" rx="20" fill="#ffffff" stroke="#d8e0eb" stroke-width="2" />
    <rect x="1016" y="314" width="8" height="458" rx="4" fill="#25806c" />
    <text class="mono" x="1056" y="376" font-size="20" font-weight="700" fill="#26725f">03 / TEST</text>
    <text class="sans" x="1056" y="434" font-size="36" font-weight="700" fill="#142136">Use known inputs</text>
    <rect x="1056" y="478" width="304" height="94" rx="12" fill="#101a2a" />
    <text class="mono" x="1086" y="536" font-size="28" fill="#a8eadc">cargo test</text>
    <text class="sans" x="1056" y="634" font-size="22" fill="#56657a">Known values · edge cases</text>
    <text class="sans" x="1056" y="674" font-size="22" fill="#56657a">Check data handling before</text>
    <text class="sans" x="1056" y="710" font-size="22" fill="#56657a">any timing claim.</text>
  </g>

  <g>
    <rect x="1456" y="314" width="368" height="458" rx="20" fill="#ffffff" stroke="#d8e0eb" stroke-width="2" />
    <rect x="1456" y="314" width="8" height="458" rx="4" fill="#aa752a" />
    <text class="mono" x="1496" y="376" font-size="20" font-weight="700" fill="#93611f">04 / RECORD</text>
    <text class="sans" x="1496" y="434" font-size="36" font-weight="700" fill="#142136">Pin the setup</text>
    <rect x="1496" y="478" width="288" height="142" rx="12" fill="#101a2a" />
    <text class="mono" x="1524" y="530" font-size="23" fill="#f4f7fb">rustc --version</text>
    <text class="mono" x="1524" y="574" font-size="23" fill="#f0c46b">Cargo.lock</text>
    <text class="sans" x="1496" y="674" font-size="22" fill="#56657a">Record the command, data,</text>
    <text class="sans" x="1496" y="710" font-size="22" fill="#56657a">machine, and limitations.</text>
  </g>

  <path d="M1640 814V850H280V814" fill="none" stroke="#9aa9bc" stroke-width="3" stroke-dasharray="9 11" marker-end="url(#arrow)" />
  <text class="sans" x="960" y="840" text-anchor="middle" font-size="20" fill="#617084">Use the evidence to refine the next question</text>

  <rect x="96" y="892" width="1728" height="104" rx="18" fill="#e8eef5" />
  <circle cx="136" cy="944" r="10" fill="#d75d3e" />
  <text class="mono" x="164" y="938" font-size="18" font-weight="700" fill="#744630">PROPOSED WORKFLOW ONLY</text>
  <text class="sans" x="164" y="972" font-size="20" fill="#4c5d72">No Cargo project, tested Rust ML implementation, or benchmark result is present in this repository.</text>
</svg>
