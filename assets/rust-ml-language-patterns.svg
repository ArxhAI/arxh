<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Rust language patterns for ML data handling</title>
  <desc id="desc">Three standard Rust concepts shown with numeric input: an owned Vec of floating point samples, a borrowed slice view, and an Option result that makes empty input explicit. This is an illustrative code schematic, not compiled code or an Arxh experiment.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8196b2" />
    </marker>
  </defs>

  <rect width="1920" height="1080" rx="32" fill="#0b1220" />
  <text class="mono" x="96" y="92" font-size="23" font-weight="700" letter-spacing="3" fill="#ff865d">ARXH / RUST PROGRAMMING</text>
  <text class="sans" x="96" y="166" font-size="58" font-weight="700" fill="#f4f7fb">A Rust-shaped path for numerical data</text>
  <text class="sans" x="96" y="214" font-size="25" fill="#aebbd0">Ownership, borrowed views, and explicit handling of empty input</text>

  <g>
    <rect x="96" y="278" width="540" height="594" rx="20" fill="#131f33" stroke="#30425e" stroke-width="2" />
    <text class="mono" x="132" y="330" font-size="18" font-weight="700" letter-spacing="2" fill="#ff9b76">01 / OWN THE BUFFER</text>
    <text class="sans" x="132" y="380" font-size="31" font-weight="700" fill="#f4f7fb">Samples live in a Vec</text>
    <rect x="132" y="420" width="468" height="190" rx="12" fill="#0a101c" stroke="#283a54" />
    <text class="mono" x="158" y="470" font-size="23" fill="#dce7f5">let samples = vec![</text>
    <text class="mono" x="158" y="512" font-size="23" fill="#f0c46b">    0.2_f32, 0.8,</text>
    <text class="mono" x="158" y="554" font-size="23" fill="#dce7f5">];</text>
    <text class="sans" x="132" y="658" font-size="22" fill="#b5c3d8">The vector owns its elements.</text>
    <g>
      <rect x="144" y="704" width="128" height="64" rx="9" fill="#203550" stroke="#76c8f1" stroke-width="2" />
      <rect x="278" y="704" width="128" height="64" rx="9" fill="#203550" stroke="#76c8f1" stroke-width="2" />
      <rect x="412" y="704" width="128" height="64" rx="9" fill="#203550" stroke="#76c8f1" stroke-width="2" />
      <text class="mono" x="208" y="745" text-anchor="middle" font-size="20" fill="#dbeeff">0.2</text>
      <text class="mono" x="342" y="745" text-anchor="middle" font-size="20" fill="#dbeeff">0.8</text>
      <text class="mono" x="476" y="745" text-anchor="middle" font-size="20" fill="#8295ad">…</text>
    </g>
    <text class="mono" x="132" y="820" font-size="16" fill="#8295ad">OWNER: samples</text>
  </g>

  <path d="M654 573H688" stroke="#8196b2" stroke-width="3" marker-end="url(#arrow)" />

  <g>
    <rect x="690" y="278" width="540" height="594" rx="20" fill="#131f33" stroke="#30425e" stroke-width="2" />
    <text class="mono" x="726" y="330" font-size="18" font-weight="700" letter-spacing="2" fill="#83d6c3">02 / BORROW A VIEW</text>
    <text class="sans" x="726" y="380" font-size="31" font-weight="700" fill="#f4f7fb">Read through a slice</text>
    <rect x="726" y="420" width="468" height="190" rx="12" fill="#0a101c" stroke="#283a54" />
    <text class="mono" x="752" y="478" font-size="21" fill="#dce7f5">let view: &amp;[f32] =</text>
    <text class="mono" x="752" y="520" font-size="21" fill="#83d6c3">    samples.as_slice();</text>
    <text class="sans" x="726" y="658" font-size="22" fill="#b5c3d8">A shared borrow does not move Vec.</text>
    <g>
      <rect x="738" y="704" width="128" height="64" rx="9" fill="#203550" stroke="#76c8f1" stroke-width="2" />
      <rect x="872" y="704" width="128" height="64" rx="9" fill="#203550" stroke="#76c8f1" stroke-width="2" />
      <rect x="1006" y="704" width="128" height="64" rx="9" fill="#203550" stroke="#76c8f1" stroke-width="2" />
      <text class="mono" x="802" y="745" text-anchor="middle" font-size="20" fill="#dbeeff">0.2</text>
      <text class="mono" x="936" y="745" text-anchor="middle" font-size="20" fill="#dbeeff">0.8</text>
      <text class="mono" x="1070" y="745" text-anchor="middle" font-size="20" fill="#8295ad">…</text>
      <path d="M752 690V680H1130V690" fill="none" stroke="#83d6c3" stroke-width="2" stroke-dasharray="7 7" />
    </g>
    <text class="mono" x="726" y="820" font-size="16" fill="#8295ad">VIEW: &amp;[f32] · READ ONLY</text>
  </g>

  <path d="M1248 573H1282" stroke="#8196b2" stroke-width="3" marker-end="url(#arrow)" />

  <g>
    <rect x="1284" y="278" width="540" height="594" rx="20" fill="#131f33" stroke="#30425e" stroke-width="2" />
    <text class="mono" x="1320" y="330" font-size="18" font-weight="700" letter-spacing="2" fill="#f0c46b">03 / STATE THE EDGE CASE</text>
    <text class="sans" x="1320" y="380" font-size="31" font-weight="700" fill="#f4f7fb">Return an Option</text>
    <rect x="1320" y="420" width="468" height="225" rx="12" fill="#0a101c" stroke="#283a54" />
    <text class="mono" x="1344" y="464" font-size="19" fill="#dce7f5">fn mean(xs: &amp;[f32])</text>
    <text class="mono" x="1344" y="502" font-size="19" fill="#f0c46b">    -&gt; Option&lt;f32&gt; {</text>
    <text class="mono" x="1344" y="540" font-size="19" fill="#dce7f5">    if xs.is_empty() {</text>
    <text class="mono" x="1344" y="578" font-size="19" fill="#ff9b76">        return None;</text>
    <text class="mono" x="1344" y="616" font-size="19" fill="#dce7f5">    }</text>
    <rect x="1320" y="682" width="214" height="74" rx="12" fill="#17364a" stroke="#83d6c3" stroke-width="2" />
    <text class="mono" x="1427" y="728" text-anchor="middle" font-size="22" fill="#a5efdc">Some(value)</text>
    <rect x="1550" y="682" width="238" height="74" rx="12" fill="#3a2933" stroke="#ff9b76" stroke-width="2" />
    <text class="mono" x="1669" y="728" text-anchor="middle" font-size="22" fill="#ffc4b2">None</text>
    <text class="sans" x="1320" y="812" font-size="20" fill="#b5c3d8">Empty input is not a hidden special case.</text>
  </g>

  <rect x="96" y="918" width="1728" height="90" rx="16" fill="#17283d" stroke="#30425e" />
  <circle cx="134" cy="963" r="9" fill="#ff865d" />
  <text class="mono" x="162" y="955" font-size="16" font-weight="700" fill="#ffab8d">ILLUSTRATIVE STANDARD RUST</text>
  <text class="sans" x="162" y="984" font-size="19" fill="#c1cedf">Not compiled here. No Arxh ML program, framework, training run, or result is represented.</text>
</svg>
