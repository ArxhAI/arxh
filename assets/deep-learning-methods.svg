<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 590" role="img" aria-labelledby="title desc">
  <title id="title">Three neural-network method families</title>
  <desc id="desc">Original conceptual diagrams comparing dense multilayer perceptron layers, local convolutional filters, and token-level self-attention. They are not implementations, trained model outputs, or benchmark results.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1360" height="590" rx="22" fill="#0e1727" />
  <text class="mono" x="64" y="58" font-size="12" font-weight="700" letter-spacing="1.5" fill="#74d4dc">METHOD NOTES / CONCEPTUAL OVERVIEW</text>
  <text class="sans" x="64" y="105" font-size="31" font-weight="700" fill="#f5f8fc">Three ways to structure a neural network</text>
  <text class="sans" x="64" y="137" font-size="15" fill="#aab7c8">Different assumptions about how information should interact — not a performance ranking.</text>

  <!-- MLP card -->
  <g>
    <rect x="64" y="176" width="392" height="328" rx="14" fill="#152238" stroke="#2a3a53" />
    <text class="mono" x="88" y="212" font-size="12" font-weight="700" fill="#72c6f0">01 / DENSE</text>
    <text class="sans" x="88" y="243" font-size="20" font-weight="700" fill="#f5f8fc">Multilayer perceptron</text>
    <text class="sans" x="88" y="268" font-size="13" fill="#aab7c8">Each layer mixes its incoming features.</text>
    <g stroke="#7190ae" stroke-opacity="0.42" stroke-width="1.2">
      <path d="M151 324L242 312M151 324L242 348M151 324L242 384M151 354L242 312M151 354L242 348M151 354L242 384M151 384L242 312M151 384L242 348M151 384L242 384" />
      <path d="M258 312L347 329M258 312L347 365M258 348L347 329M258 348L347 365M258 384L347 329M258 384L347 365" />
    </g>
    <g fill="#152238" stroke="#72c6f0" stroke-width="2">
      <circle cx="151" cy="324" r="8" /><circle cx="151" cy="354" r="8" /><circle cx="151" cy="384" r="8" />
      <circle cx="250" cy="312" r="8" /><circle cx="250" cy="348" r="8" /><circle cx="250" cy="384" r="8" />
      <circle cx="355" cy="329" r="8" /><circle cx="355" cy="365" r="8" />
    </g>
    <text class="mono" x="151" y="420" text-anchor="middle" font-size="10" fill="#8293a9">INPUT</text>
    <text class="mono" x="250" y="420" text-anchor="middle" font-size="10" fill="#8293a9">HIDDEN</text>
    <text class="mono" x="355" y="420" text-anchor="middle" font-size="10" fill="#8293a9">OUTPUT</text>
    <text class="sans" x="88" y="470" font-size="12" fill="#d6dfeb">Study: shape flow · activations · gradients</text>
  </g>

  <!-- CNN card -->
  <g>
    <rect x="484" y="176" width="392" height="328" rx="14" fill="#152238" stroke="#2a3a53" />
    <text class="mono" x="508" y="212" font-size="12" font-weight="700" fill="#91d2a0">02 / LOCAL FILTERS</text>
    <text class="sans" x="508" y="243" font-size="20" font-weight="700" fill="#f5f8fc">Convolutional network</text>
    <text class="sans" x="508" y="268" font-size="13" fill="#aab7c8">A shared kernel scans a structured input.</text>
    <g fill="#233650" stroke="#66809e" stroke-width="1">
      <rect x="532" y="309" width="28" height="28" /><rect x="560" y="309" width="28" height="28" /><rect x="588" y="309" width="28" height="28" /><rect x="616" y="309" width="28" height="28" />
      <rect x="532" y="337" width="28" height="28" /><rect x="560" y="337" width="28" height="28" /><rect x="588" y="337" width="28" height="28" /><rect x="616" y="337" width="28" height="28" />
      <rect x="532" y="365" width="28" height="28" /><rect x="560" y="365" width="28" height="28" /><rect x="588" y="365" width="28" height="28" /><rect x="616" y="365" width="28" height="28" />
      <rect x="532" y="393" width="28" height="28" /><rect x="560" y="393" width="28" height="28" /><rect x="588" y="393" width="28" height="28" /><rect x="616" y="393" width="28" height="28" />
    </g>
    <rect x="558" y="335" width="58" height="58" rx="2" fill="#91d2a0" fill-opacity="0.24" stroke="#91d2a0" stroke-width="2" />
    <path d="M660 365H707" stroke="#91d2a0" stroke-width="2" />
    <path d="M700 359L708 365L700 371" fill="none" stroke="#91d2a0" stroke-width="2" />
    <g fill="#91d2a0" fill-opacity="0.85">
      <rect x="726" y="326" width="20" height="20" rx="3" /><rect x="752" y="326" width="20" height="20" rx="3" /><rect x="778" y="326" width="20" height="20" rx="3" />
      <rect x="726" y="352" width="20" height="20" rx="3" /><rect x="752" y="352" width="20" height="20" rx="3" /><rect x="778" y="352" width="20" height="20" rx="3" />
      <rect x="726" y="378" width="20" height="20" rx="3" /><rect x="752" y="378" width="20" height="20" rx="3" /><rect x="778" y="378" width="20" height="20" rx="3" />
    </g>
    <text class="mono" x="588" y="444" text-anchor="middle" font-size="10" fill="#8293a9">INPUT + KERNEL</text>
    <text class="mono" x="762" y="444" text-anchor="middle" font-size="10" fill="#8293a9">FEATURE MAP</text>
    <text class="sans" x="508" y="470" font-size="12" fill="#d6dfeb">Study: receptive field · weight sharing</text>
  </g>

  <!-- Attention card -->
  <g>
    <rect x="904" y="176" width="392" height="328" rx="14" fill="#152238" stroke="#2a3a53" />
    <text class="mono" x="928" y="212" font-size="12" font-weight="700" fill="#e4b57c">03 / TOKEN MIXING</text>
    <text class="sans" x="928" y="243" font-size="20" font-weight="700" fill="#f5f8fc">Self-attention</text>
    <text class="sans" x="928" y="268" font-size="13" fill="#aab7c8">Each token can use information from others.</text>
    <g class="mono" font-size="10" text-anchor="middle" fill="#e4b57c">
      <text x="1002" y="318">t₁</text><text x="1050" y="318">t₂</text><text x="1098" y="318">t₃</text><text x="1146" y="318">t₄</text>
    </g>
    <g stroke="#e4b57c" stroke-opacity="0.3" stroke-width="1">
      <path d="M1002 328L1002 345M1002 328L1050 345M1002 328L1098 345M1002 328L1146 345M1050 328L1002 345M1050 328L1050 345M1050 328L1098 345M1050 328L1146 345M1098 328L1002 345M1098 328L1050 345M1098 328L1098 345M1098 328L1146 345M1146 328L1002 345M1146 328L1050 345M1146 328L1098 345M1146 328L1146 345" />
    </g>
    <g fill="#e4b57c" fill-opacity="0.9">
      <rect x="986" y="345" width="32" height="23" rx="3" /><rect x="1034" y="345" width="32" height="23" rx="3" />
      <rect x="1082" y="345" width="32" height="23" rx="3" /><rect x="1130" y="345" width="32" height="23" rx="3" />
    </g>
    <g stroke="#566c87" stroke-width="1">
      <rect x="990" y="389" width="22" height="18" fill="#d98a55" /><rect x="1014" y="389" width="22" height="18" fill="#704e4e" /><rect x="1038" y="389" width="22" height="18" fill="#394b66" /><rect x="1062" y="389" width="22" height="18" fill="#293a53" />
      <rect x="990" y="410" width="22" height="18" fill="#485b75" /><rect x="1014" y="410" width="22" height="18" fill="#bd7855" /><rect x="1038" y="410" width="22" height="18" fill="#654d50" /><rect x="1062" y="410" width="22" height="18" fill="#344761" />
      <rect x="990" y="431" width="22" height="18" fill="#31445e" /><rect x="1014" y="431" width="22" height="18" fill="#455872" /><rect x="1038" y="431" width="22" height="18" fill="#c47d56" /><rect x="1062" y="431" width="22" height="18" fill="#71504e" />
      <rect x="990" y="452" width="22" height="18" fill="#293b54" /><rect x="1014" y="452" width="22" height="18" fill="#394b65" /><rect x="1038" y="452" width="22" height="18" fill="#586981" /><rect x="1062" y="452" width="22" height="18" fill="#d18a5b" />
    </g>
    <text class="mono" x="1098" y="405" font-size="10" fill="#8293a9">ATTENTION</text>
    <text class="mono" x="1098" y="422" font-size="10" fill="#8293a9">WEIGHTS</text>
    <text class="sans" x="928" y="485" font-size="12" fill="#d6dfeb">Study: context mixing · sequence length</text>
  </g>

  <text class="sans" x="64" y="548" font-size="12" fill="#8c9bb0">Concept sketches only · layer sizes and colors are illustrative · not an Arxh model, implementation, or result.</text>
</svg>
